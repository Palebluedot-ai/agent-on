# Agent-On v2 CI：香港时间每天 01:23 全量及按需手动触发；日常开发本地验证。
name: gate

on:
  schedule:
    - cron: '23 17 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    name: CLI 测试与范围回归
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUST_TOOLCHAIN: '1.97.1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 全量验证计划
        run: python3 .github/scripts/quality_scope.py --full --output "$RUNNER_TEMP/quality-plan.json"
      - name: 固定 Rust 工具链
        id: toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
          echo "fingerprint=$(rustup run "$RUST_TOOLCHAIN" rustc -Vv | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: 缓存依赖下载
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-download-v3-${{ runner.os }}-${{ hashFiles('cli/Cargo.lock') }}
          restore-keys: cargo-download-v3-${{ runner.os }}-
      - name: 缓存构建结果
        uses: actions/cache@v4
        with:
          path: cli/target
          key: cargo-build-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-debug0-incremental0-${{ hashFiles('cli/Cargo.lock') }}-${{ hashFiles('cli/src/**', 'cli/tests/**', 'cli/Cargo.toml', 'cli/build.rs', '.github/workflows/gate.yml') }}
          restore-keys: cargo-build-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-debug0-incremental0-${{ hashFiles('cli/Cargo.lock') }}-
      - name: cargo fmt
        run: cargo fmt --manifest-path cli/Cargo.toml --check
      - name: cargo clippy
        run: python3 .github/scripts/quality_scope.py --clippy --output "$RUNNER_TEMP/quality-plan.json"
      - name: 全量 Rust 测试
        run: python3 .github/scripts/quality_scope.py --run --output "$RUNNER_TEMP/quality-plan.json"
      - name: CI 范围选择器单测
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

  docs:
    name: 文档与版本一致性闸
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 文档与包元数据不变量
        env:
          AGENT_ON_DOC_GATE_OFF: ${{ vars.AGENT_ON_DOC_GATE_OFF }}
        run: python3 .github/scripts/check_docs.py
