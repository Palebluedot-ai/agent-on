# 单一控制点(只有 orchestrator 写;轨道 agent 只读)
# 生产切换同批更新:加载调度器 / 切换通道 / 启停发送这类改变「每天实际发生什么」的合流,
# 必须同批改本文件与 README product map;接续握手先核运行实况,文件与实况打架以实况为准(truth-hierarchy 五⅞.2)
# 记账生成完立刻提交:生成 + add + commit 放进同一条命令,别在工作区留未提交的台账——同文件闸会拿它挡别人(kit/worktree-control-plane「热点文件」)
version: 1
project: "[项目名]"

current_phase: "[一句话:现在在哪]"
# current_bottleneck: 只写会挡住 agent 动手的阻塞。
# 禁止把 human-async 单独写成全局瓶颈(人审 Excel/人买域名/人给密钥等)——那些进 phases 并行 todo 或单卡 status:blocked。
# 实证:IPONews 2026-07-16 excel 审阅占 bottleneck 冻结整仓;改并行 todo 后同日多 Loop 交付。
current_bottleneck: "[当前最大瓶颈——仅 agent 动手阻塞;human-async 勿独占此字段]"
# 发布 blocker 证据(可选):结构化记「已通过项 + 正确阻塞项」,安全阻塞也是进展(inbox-radar preflight)
# release_blockers: [{check: env|Graph|…, status: pass|block, evidence: "…"}]
# TODO/推迟项触发格式(Dartify): 机械信号 path∩diff 或 日历死线 YYYY-MM-DD —— 禁止「下次动 X 时顺手」
# monitoring_summary 若写 CI 结论,必须读「最新非 skip 提交」的结论——[skip ci] 状态提交会让 main 顶上永远没有新结论(truth-hierarchy 五⅞.3)
monitoring_summary: "[最近一次合流的战报摘要:测试数/关键交付/悬点裁决]"

phases:
  - id: "[s1.1-xxx]"
    file: "docs/phases/phase-[s1.1-xxx].md"
    range: "1-30"
    self_contained: true
    status: "todo"          # todo | in_progress | done | blocked
    error_signals_unhandled: 0

notes: "[悬点裁决记录/挂账项/下一步]"
