<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent-On · 项目看板</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;color:#e9eff6;background:#0c131d;font-size:14px;--line:#253243;--muted:#9baabd;--mint:#8ee3c2;--amber:#edbb85;--red:#f5a7ad;--blue:#abc6f8}
*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button,summary{cursor:pointer}button,input{border:1px solid var(--line);background:#152131;color:inherit;border-radius:8px;padding:9px 13px}button:hover{border-color:#8295aa}button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--mint);outline-offset:3px}a{color:var(--blue)}main{max-width:1600px;margin:auto;padding:28px 32px}header,.toolbar,.section-head,.card-head,.host-line,.card-bottom,.lane-head{display:flex;justify-content:space-between;align-items:center;gap:12px}header{margin-bottom:25px}.brand{display:flex;gap:14px;align-items:center}.logo{width:42px;height:42px;display:grid;place-items:center;background:#182f2b;border:1px solid #31594b;border-radius:11px;color:var(--mint);font-size:20px;font-weight:700}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--muted)}h1{font-size:26px;margin:4px 0 0;font-weight:650;letter-spacing:-.5px}h2{font-size:17px;margin:0}h3{font-size:14px;margin:0}p{line-height:1.65}.muted{font-size:12px;color:var(--muted)}.header-actions{display:flex;align-items:center;gap:12px}.signal,.bad{display:inline-flex;align-items:center;gap:7px;font-size:12px}.signal{color:var(--mint)}.bad{color:var(--amber)}.signal:before,.bad:before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}.metric{border:1px solid var(--line);background:#111b28;border-radius:12px;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}.metric strong{font-size:32px;font-variant-numeric:tabular-nums;font-weight:600}.metric small{display:block;margin-top:5px;color:var(--muted);font-size:11px}.metric.hot strong{color:var(--red)}.toolbar{margin:24px 0 17px}.toolbar-left{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.filters{display:flex;gap:5px;flex-wrap:wrap}.filters button{padding:6px 11px;font-size:12px;background:transparent}.filters button[aria-pressed=true]{background:#233748;border-color:#4c6b80}input{width:235px;max-width:100%;font-size:12px}.notice{border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:9px;background:#151f2a;padding:11px 15px;margin:16px 0}.notice summary{font-size:12px;color:#cfdae7}.notice ul{padding-left:18px;font-size:12px;color:var(--muted);line-height:1.7}.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;align-items:start}.lane{min-width:0;background:#101925;border:1px solid var(--line);border-radius:12px;padding:14px 11px;min-height:270px}.lane-head{padding:1px 3px 14px;justify-content:flex-start}.lane-head .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}.lane[data-lane=working] .dot{background:var(--mint)}.lane[data-lane=blocked] .dot{background:var(--red)}.lane[data-lane=reported] .dot{background:var(--blue)}.lane-count{margin-left:auto;color:var(--muted);font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 7px}.lane-empty{color:#8293a8;font-size:12px;text-align:center;padding:42px 8px}.task-card{background:#172333;border:1px solid #2c3c50;border-radius:10px;padding:14px;margin-bottom:10px;overflow-wrap:anywhere}.task-card[data-state=blocked]{border-left:3px solid var(--red)}.card-head{align-items:flex-start;margin-bottom:11px}.task-title{font-size:14px;line-height:1.6;min-width:0;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.host-line{justify-content:flex-start;gap:6px;flex-wrap:wrap;margin-bottom:12px}.host-badge,.pill{display:inline-block;border:1px solid #4b5e75;border-radius:5px;padding:2px 6px;font-size:10px;line-height:1.5;color:#c4d0e0}.host-badge.codex{background:#17362e;color:#a4e6cd;border-color:#365c50}.host-badge.claude{background:#3a2b23;color:#efc298;border-color:#725037}.host-badge.grok{background:#29323e}.host-badge.hermes{background:#312d43;color:#d4c3f4}.task-note{font-size:12px;line-height:1.7;color:#bfccdc;margin:0 0 12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.task-card[data-state=blocked] .task-note{color:#efb6bb}.card-bottom{font-size:10px;color:var(--muted)}.task-details{margin-top:12px;border-top:1px solid var(--line);padding-top:9px}.task-details summary{font-size:11px;color:#a9bfd5;list-style:none}.task-details summary:before{content:'+ ';color:var(--muted)}.task-details[open] summary:before{content:'− '}.detail-item{font-size:11px;line-height:1.7;margin:10px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}.detail-item strong{display:block;font-weight:500;color:#8ea0b7;margin-bottom:3px}.empty{font-size:12px;color:var(--muted);line-height:1.7}.below{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px}.panel,.archive,.infrastructure{background:#101925;border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}.section-head{margin-bottom:12px}.archive{margin-top:18px}.archive>summary,.infrastructure>summary{font-size:13px;color:#b8c6d7}.archive-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:16px}.infrastructure{margin-top:16px}.infrastructure-content{margin-top:18px}.table-scroll{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;color:var(--muted);font-weight:500}th,td{padding:11px 7px;border-bottom:1px solid var(--line);vertical-align:top}td{overflow-wrap:anywhere}tr:last-child td{border:0}footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin:22px 0 2px}body.wall main{max-width:none}body.wall .below,body.wall .archive,body.wall .infrastructure{display:none}body.wall .lane{min-height:55vh}
@media(min-width:1700px){body.wall .task-title{font-size:18px}body.wall .task-note{font-size:15px}body.wall .task-card{padding:20px}}
@media(max-width:1050px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}.archive-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.metric{padding:14px}.toolbar{align-items:flex-start;flex-wrap:wrap}}
@media(max-width:600px){main{padding:18px 14px}header{align-items:flex-start;flex-direction:column;gap:16px}.header-actions{width:100%;flex-wrap:wrap}.metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.metric strong{font-size:27px}.board,.below,.archive-grid{grid-template-columns:1fr}.lane{min-height:140px}.lane-empty{padding:24px 8px}.toolbar-left{align-items:flex-start;flex-direction:column}input{width:100%}.toolbar{gap:14px}.toolbar input{width:100%}h1{font-size:24px}.notice{padding:10px 12px}}
</style>
</head>
<body>
<main>
<header><div class="brand"><div class="logo" aria-hidden="true">A</div><div><div class="eyebrow">AGENT-ON / PROJECT BOARD</div><h1 id="project">项目看板</h1></div></div><div class="header-actions"><span id="connection" class="signal" role="status" aria-live="polite">连接中</span><button id="wall" aria-pressed="false">大屏模式</button><button id="refresh">刷新</button></div></header>
<div class="metrics"><div class="metric"><div>待处理任务<small>同项目 · 所有工具</small></div><strong id="taskCount">—</strong></div><div class="metric hot"><div>任务卡住<small>需要处理的阻塞</small></div><strong id="blockedCount">—</strong></div><div class="metric"><div>已回传窗口<small>非全部窗口或实时在线数</small></div><strong id="sessionCount">—</strong></div><div class="metric"><div>工作区<small><span id="conflictCount">—</span> 处路径重叠</small></div><strong id="treeCount">—</strong></div></div>
<details id="attention" class="notice"><summary id="attentionSummary">正在读取项目状态…</summary><div id="attentionNotes"></div></details>
<div class="toolbar"><div class="toolbar-left"><h2>任务看板</h2><div id="hostFilters" class="filters" role="group" aria-label="按执行工具筛选"><button data-host="all" aria-pressed="true">全部</button><button data-host="codex" aria-pressed="false">Codex</button><button data-host="claude" aria-pressed="false">Claude</button><button data-host="grok" aria-pressed="false">Grok</button><button data-host="hermes" aria-pressed="false">Hermes</button></div></div><input id="filter" placeholder="搜索任务或路径" aria-label="筛选任务、分支、路径"></div>
<p id="activityStatus" class="bad">窗口活动未知 · 实时活动回执未接入，以下只显示已登记任务进度</p>
<section class="panel" style="margin-bottom:18px"><h2>窗口在做什么</h2><p class="muted">最后活动与显式回传 · 不自动改变任务阶段</p><div id="windowActivity" class="table-scroll"></div></section>
<div id="tasks" class="board" aria-label="已登记项目任务进度"></div>
<details class="archive" id="archive"><summary id="archiveSummary">已结项</summary><div id="archiveTasks" class="archive-grid"></div></details>
<div class="below"><section class="panel"><div class="section-head"><h2>执行窗口</h2><span id="oncall" class="muted"></span></div><div id="sessions" class="table-scroll"></div></section><section class="panel"><div class="section-head"><h2>PR 合流</h2><span id="prMeta" class="muted"></span></div><div id="prs" class="table-scroll"></div></section></div>
<details class="infrastructure"><summary>工作区与冲突详情</summary><div class="infrastructure-content"><h2>工作区</h2><div id="trees" class="table-scroll"></div><h2 style="margin-top:24px">冲突与观察缺口</h2><div id="conflicts" class="table-scroll"></div><p class="muted">旧工作区也会显示。没有任务关联不代表已完成；此页面不派工、不合并、不删除工作区。</p></div></details>
<footer><span id="clock">正在读取…</span><span>每 5 秒自动读取 · 已回传 ≠ 已验收</span></footer>
</main>
<script>
const el=id=>document.getElementById(id);let last,hostFilter='all';const openTasks=new Set();
const names={queued:'待安排',working:'进行中',blocked:'卡住了',waiting:'等待中',reported:'待验收',dispatched:'已派工',released:'已结项',reclaimed:'已回收',ready:'已收到宿主确认',starting:'启动中','running-unconfirmed':'待宿主确认',exited:'进程已退出',failed:'启动失败',closed:'已关闭',observed:'已观察','turn-finished':'本轮结束',NOW:'优先处理',NEXT:'等待前置',PARALLEL:'可并行准备',FIX:'需要修复',STALE:'证据需更新',SKIP:'复用文件证据',ACTIVE:'开发中',WAITING:'等待中',PARKED:'已暂停',RESCUE:'需保全',REAPABLE:'回收候选',green:'通过',red:'失败',pending:'运行中',unknown:'未知',none:'未配置'};
const hostNames={codex:'Codex','codex-app':'Codex',claude:'Claude',grok:'Grok',hermes:'Hermes',antigravity:'Antigravity'};
const label=s=>names[s]||s||'未知',arr=x=>Array.isArray(x)?x:[];
const normalizeHost=h=>h==='codex-app'?'codex':h;
const time=s=>{try{return new Intl.DateTimeFormat('zh-HK',{dateStyle:'short',timeStyle:'medium',timeZone:'Asia/Hong_Kong'}).format(new Date(s))}catch{return s||'未知'}};
function age(s){const n=Date.now()-Date.parse(s);if(!Number.isFinite(n))return '更新时间未知';if(n<60000)return '刚刚回传';if(n<3600000)return `${Math.floor(n/60000)} 分钟前`;if(n<86400000)return `${Math.floor(n/3600000)} 小时前`;return `${Math.floor(n/86400000)} 天前`}
function node(tag,text,cls){const n=document.createElement(tag);if(text!=null)n.textContent=String(text);if(cls)n.className=cls;return n}
function empty(target,text){target.replaceChildren(node('p',text,'empty'))}
function table(id,heads,rows){const target=el(id);if(!rows.length){empty(target,'暂无记录');return}const t=node('table'),h=node('tr');heads.forEach(v=>h.append(node('th',v)));t.append(h);rows.forEach(row=>{const tr=node('tr');row.forEach(v=>{const td=node('td');if(v instanceof Node)td.append(v);else td.textContent=String(v??'—');tr.append(td)});t.append(tr)});target.replaceChildren(t)}
function pill(s){return node('span',label(s),'pill')}
function related(task,sessions){return sessions.filter(s=>s.task===task.id).sort((a,b)=>(b.heartbeat_at||'').localeCompare(a.heartbeat_at||''))}
function taskHosts(task,sessions){const ss=related(task,sessions),hosts=ss.length?ss.map(s=>normalizeHost(s.host)):task.last_reporter?.host?[normalizeHost(task.last_reporter.host)]:[];return [...new Set(hosts)]}
function detail(target,title,value){const item=node('div',null,'detail-item');item.append(node('strong',title),node('span',value||'未记录'));target.append(item)}
function card(task,sessions,results){
  const ss=related(task,sessions),result=results.filter(r=>r.task===task.id).sort((a,b)=>(b.at||'').localeCompare(a.at||''))[0];
  const c=node('article',null,'task-card');c.dataset.task=task.id;c.dataset.state=task.state;
  const head=node('div',null,'card-head');head.append(node('h3',task.title||task.goal||task.id,'task-title'));c.append(head);
  const hosts=node('div',null,'host-line');
  if(ss.length){[...new Set(ss.map(s=>normalizeHost(s.host)))].forEach(h=>hosts.append(node('span',hostNames[h]||h,'host-badge '+(hostNames[h]?h:''))));hosts.append(node('span','关联执行窗口','muted'))}
  else if(task.last_reporter?.host){const h=normalizeHost(task.last_reporter.host);hosts.append(node('span',hostNames[h]||h,'host-badge '+(hostNames[h]?h:'')),node('span','最近登记 / 回传','muted'))}
  else hosts.append(node('span','未关联工具','host-badge'));
  c.append(hosts);
  const note=task.state==='released'||task.state==='reclaimed'?'已结项 · 证据见详情':task.state==='reported'?'结果已回传，等待核验':task.progress?.note||(task.dependencies?.length?'等待前置任务':'等待安排');
  c.append(node('p',note,'task-note'));
  const bottom=node('div',null,'card-bottom');bottom.append(node('span',label(task.state)),node('span',age(task.released_at||task.progress?.at||result?.at||task.created_at)));c.append(bottom);
  const d=node('details',null,'task-details');d.dataset.task=task.id;d.open=openTasks.has(task.id);d.append(node('summary','查看详情'));
  detail(d,'目标',task.goal);detail(d,'当前进度',task.progress?.note);detail(d,'任务编号',task.id);detail(d,'涉及文件',arr(task.paths).join('\n'));detail(d,'工作区',task.worktree);
  if(task.dependencies?.length)detail(d,'前置任务',task.dependencies.join(', '));
  if(ss.length)detail(d,'执行窗口回执',ss.map(s=>`${hostNames[s.host]||s.host} · ${label(s.state)}${s.process_alive===false?' · 进程已消失':''}${s.heartbeat_age_seconds>120?' · 回执陈旧':''}`).join('\n'));
  if(task.last_reporter)detail(d,'最近登记 / 回传来源',`${hostNames[task.last_reporter.host]||task.last_reporter.host} · ${task.last_reporter.session_id}（不代表当前在线或拥有合入权限）`);
  if(result)detail(d,'结果回执（未自动验收）',result.summary);
  if(task.evidence)detail(d,'结项依据',task.evidence);
  d.addEventListener('toggle',()=>{if(d.isConnected){if(d.open)openTasks.add(task.id);else openTasks.delete(task.id)}});c.append(d);return c;
}
function render(v){
  last=v;const p=v.patrol?.data||{},q=el('filter').value.toLowerCase(),matches=x=>JSON.stringify(x).toLowerCase().includes(q);
  const tasks=arr(p.tasks),sessions=arr(p.sessions),trees=arr(v.worktrees),results=arr(p.results),tracks=arr(v.landing?.data?.snapshot?.tracks||v.landing?.data?.tracks),finished=t=>['released','reclaimed'].includes(t.state),activity=arr(v.activity?.windows);
  const filtered=tasks.filter(matches).filter(t=>hostFilter==='all'||taskHosts(t,sessions).includes(hostFilter));
  el('project').textContent=(v.repo||'').split('/').pop()||'项目看板';el('clock').textContent=`观察 ${time(v.observed_at)}（香港） · ${(v.head||'').slice(0,10)}`;
  el('taskCount').textContent=v.patrol?.available?tasks.filter(t=>!finished(t)).length:'—';el('blockedCount').textContent=v.patrol?.available?tasks.filter(t=>t.state==='blocked').length:'—';
  el('sessionCount').textContent=activity.length|| (v.patrol?.available?sessions.filter(s=>!['closed','exited','failed','superseded'].includes(s.state)&&s.process_alive!==false).length:'—');el('treeCount').textContent=trees.length;el('conflictCount').textContent=v.patrol?.available?arr(p.conflicts).length:'—';
  el('activityStatus').textContent=v.activity?.available?`已有活动回传 · ${activity.length} 个已回传窗口 · 仅覆盖接入来源，不证明全部在线`:`窗口活动未知 · ${v.activity?.reason||'实时活动回执未接入'}，任务分栏不代表窗口活动`;
  el('activityStatus').className=v.activity?.available?'signal':'bad';
  const visibleActivity=activity.filter(matches).filter(w=>hostFilter==='all'||normalizeHost(w.host)===hostFilter);
  table('windowActivity',['工具 / 窗口','任务 / 正在做什么','状态与来源','最后回传'],visibleActivity.map(w=>[`${hostNames[w.host]||w.host} · ${w.session_id}`,`${w.task?w.title||w.task:'未绑定任务 · 需求观察'}\n${w.goal||'尚无目标摘要'}${arr(w.paths).length?'\n范围：'+w.paths.join(', '):''}`,`${label(w.state)} · ${w.source==='native-hook'?'宿主事件':w.source==='explicit-report'?'执行者自述 / 未核验':'仅绑定'}${w.stale?' · 陈旧，当前未知':''}\n${w.note||''}`,`${time(w.at)}${w.condition_at?' · 自述 '+time(w.condition_at):''}`]));
  const notes=arr(v.attention).slice();arr(v.activity?.errors).forEach(e=>notes.push('活动回执：'+e));for(const key of ['patrol','config','landing','oncall'])if(v[key]?.available===false)notes.push(`${key}：${v[key].error}`);if(v.collection_error)notes.push(`观察中断：${v.collection_error}`);if(v.remote_refresh?.error)notes.push(v.remote_refresh.error);
  const ul=node('ul');notes.forEach(n=>ul.append(node('li',n)));el('attentionNotes').replaceChildren(notes.length?ul:node('p','没有新的观察提示','muted'));
  el('attentionSummary').textContent=v.patrol?.available===false?'任务记录暂不可读，不能判断当前进度':v.activity?.enabled?`${notes.length} 条观察提示 · 活动观察与巡逻分别配置`:v.config?.data?.enabled===false?'自动登记未开启 · 未接入窗口的任务可能没显示':notes.length?`${notes.length} 条观察提示 · 点开查看`:'已接入任务共用此看板 · 未接入窗口不保证显示';
  const o=v.oncall?.data;el('oncall').textContent=v.oncall?.available===false?'值守状态不可读':o?.present?`值守：${o.session}`:'无值守在班';
  const lanes=[['queued','待安排',t=>!finished(t)&&!['working','dispatched','blocked','reported'].includes(t.state)],['working','进行中 · 已登记',t=>['working','dispatched'].includes(t.state)],['blocked','卡住了',t=>t.state==='blocked'],['reported','待验收',t=>t.state==='reported']];
  const board=el('tasks');board.replaceChildren();for(const [id,title,test] of lanes){const lane=node('section',null,'lane');lane.dataset.lane=id;const group=filtered.filter(test);const h=node('div',null,'lane-head');h.append(node('span',null,'dot'),node('h3',title),node('span',group.length,'lane-count'));lane.append(h);group.forEach(t=>lane.append(card(t,sessions,results)));if(!group.length)lane.append(node('div',v.patrol?.available===false?'记录不可读':q||hostFilter!=='all'?'没有匹配的已登记任务':id==='blocked'?'没有已记录的阻塞':id==='working'?'暂无已登记的进行中任务；窗口活动未知':'暂无已登记任务','lane-empty'));board.append(lane)}
  const archive=filtered.filter(finished);el('archiveSummary').textContent=`已结项 · ${archive.length}`;el('archiveTasks').replaceChildren(...archive.map(t=>card(t,sessions,results)));if(!archive.length)empty(el('archiveTasks'),'暂无匹配的结项任务');
  table('sessions',['工具 / 任务','状态','最后回执'],sessions.filter(matches).filter(s=>hostFilter==='all'||normalizeHost(s.host)===hostFilter).map(s=>[`${hostNames[s.host]||s.host} · ${tasks.find(t=>t.id===s.task)?.title||s.task||s.role}`,s.process_alive===false?'进程已消失，需核对':pill(s.state),`${time(s.heartbeat_at)}${s.heartbeat_age_seconds>120?' · 回执陈旧':''}${s.exit_code!=null?' · exit '+s.exit_code:''}`]));
  el('prMeta').textContent=v.landing_age_seconds!=null?`${v.landing_age_seconds} 秒前${v.remote_refresh_enabled?' · 自动刷新':' · 本机缓存'}`:'尚未取证';table('prs',['PR','检查 / 队列','下一步'],tracks.filter(t=>t.pr_number&&t.pr_state==='open').filter(matches).map(t=>{let pr=node('span','#'+t.pr_number);try{const u=new URL(t.url);if(u.protocol==='https:'){pr=node('a','#'+t.pr_number);pr.href=u.href;pr.target='_blank';pr.rel='noopener noreferrer'}}catch{}return[pr,`${label(t.ci)} · ${label(t.category)}`,t.reason||'等待取证']}));
  table('trees',['分支 / 路径','保护状态','本地独有提交','关联'],trees.filter(matches).map(t=>[`${t.branch||'detached'} · ${t.path}`,`${t.primary?'主工作区 · ':''}${t.locked?'locked · 保留':!t.facts?.available?'未知 · 保留':t.facts.data.clean?'干净，回收仍需证据':'有未提交内容 · 保留'}${t.lifecycle?' · '+label(t.lifecycle):''}`,t.facts?.data?.local_only_commits??'未知',t.managed===true?'受管工作区':t.managed==null?'归属未知':'现存工作区 / 未接管']));
  table('conflicts',['范围','原因 / 涉及路径'],arr(p.conflicts).concat(arr(p.unknown)).map(c=>[c.task||`${c.left||''} ↔ ${c.right||c.worktree||''}`,c.error||c.reason||`${c.kind} · ${arr(c.paths).join(', ')}`]));
}
const detailId=location.pathname.match(/^\/projects\/(p[0-9a-f]{16})$/)?.[1];
if(detailId){const a=node('a','← 系统总览');a.href='/';document.querySelector('.header-actions').prepend(a)}
async function refresh(){try{const r=await fetch(detailId?'/api/projects/'+detailId:'/api/status',{cache:'no-store',headers:{'X-Agent-On':'dashboard'}});if(!r.ok)throw Error(r.status);const v=await r.json();render(v);const n=Date.now()-Date.parse(v.observed_at);el('connection').textContent=n>15000?'观察已滞后':'自动更新';el('connection').className=n>15000?'bad':'signal'}catch(e){el('connection').textContent='连接已断开 · 保留最后观察';el('connection').className='bad'}}
el('refresh').onclick=refresh;el('filter').oninput=()=>last&&render(last);el('hostFilters').onclick=e=>{const b=e.target.closest('button[data-host]');if(!b)return;hostFilter=b.dataset.host;el('hostFilters').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));if(last)render(last)};
el('wall').onclick=()=>{const active=document.body.classList.toggle('wall');el('wall').setAttribute('aria-pressed',String(active));el('wall').textContent=active?'退出大屏':'大屏模式'};
refresh();setInterval(refresh,5000);
</script>
