[package]
name = "agent-on"
version = "0.11.0"
edition = "2021"
description = "agent-on CLI: setup, guards, lint, worktree control plane, and release helpers"
license = "MIT"
publish = false

[[bin]]
name = "agent-on"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[dev-dependencies]
tempfile = "3"
