[package]
name = "agent-on"
version = "2.0.0"
edition = "2021"
rust-version = "1.89"
description = "Zero-intrusion cross-client AI toolkit: worktree radar, merge-tree rehearsal, skill installer, and doctor"
license = "MIT"
publish = false

[[bin]]
name = "agent-on"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
